<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026학년도 2학기 늘봄학교 만족도 조사</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', 'Pretendard', sans-serif;
            background-color: #f0fdf4; /* Light green background */
        }
        .scale-radio:checked + label {
            background-color: #22c55e;
            color: white;
            border-color: #22c55e;
        }
        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="text-gray-800 h-screen flex flex-col">

    <header class="bg-green-600 text-white shadow-md p-4 flex justify-between items-center z-10 sticky top-0">
        <h1 class="text-lg md:text-xl font-bold cursor-pointer" onclick="navigate('home')">
            <i class="fa-solid fa-seedling mr-2"></i>늘봄학교 만족도 조사
        </h1>
        <button onclick="navigate('admin_login')" class="text-sm bg-green-700 hover:bg-green-800 px-3 py-1 rounded shadow transition">
            관리자 <i class="fa-solid fa-lock ml-1"></i>
        </button>
    </header>

    <main id="app-container" class="flex-grow p-4 overflow-y-auto w-full max-w-4xl mx-auto flex flex-col items-center">
        <!-- Content gets injected here by JS -->
    </main>

    <div id="modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50 fade-in">
        <div class="bg-white rounded-lg p-6 max-w-sm w-full mx-4 shadow-xl">
            <h3 id="modal-title" class="text-lg font-bold mb-2 text-gray-900">알림</h3>
            <p id="modal-message" class="text-gray-600 mb-6"></p>
            <div class="flex justify-end">
                <button onclick="closeModal()" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded font-medium transition">
                    확인
                </button>
            </div>
        </div>
    </div>

    <script>
        // --- In-Memory State ---
        // Contains collected surveys
        let surveys = {
            parentGeneral: [],
            studentGeneral: [],
            programSpecific: []
        };

        // Standard labels
        const labelsType1 = ["매우 그렇다", "그렇다", "보통이다", "그렇지 않다", "매우 그렇지 않다"];
        const labelsType2 = ["매우 충분하다", "충분하다", "보통이다", "부족하다", "매우 부족하다"];

        // Current navigation state
        let currentRole = null; // 'parent' or 'student'

        // --- Utility Functions ---
        function showModal(title, message, onClose = null) {
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-message').textContent = message;
            document.getElementById('modal').classList.remove('hidden');
            if (onClose) {
                document.getElementById('modal').onCloseCallback = onClose;
            } else {
                document.getElementById('modal').onCloseCallback = null;
            }
        }

        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
            if (document.getElementById('modal').onCloseCallback) {
                document.getElementById('modal').onCloseCallback();
            }
        }

        // --- Navigation Logic ---
        function navigate(view, params = null) {
            const container = document.getElementById('app-container');
            container.innerHTML = ''; // Clear current view
            
            if (view === 'home') {
                currentRole = null;
                renderHome(container);
            } else if (view === 'role_menu') {
                currentRole = params.role;
                renderRoleMenu(container);
            } else if (view === 'survey_form') {
                renderSurveyForm(container, params.type);
            } else if (view === 'admin_login') {
                renderAdminLogin(container);
            } else if (view === 'admin_dashboard') {
                renderAdminDashboard(container);
            }
        }

        // --- STREAMING_CHUNK:Rendering Home Screen... ---
        function renderHome(container) {
            container.innerHTML = `
                <div class="w-full flex flex-col items-center justify-center flex-grow fade-in mt-10">
                    <div class="bg-white p-8 rounded-2xl shadow-lg text-center max-w-md w-full border-t-4 border-green-500">
                        <i class="fa-solid fa-school text-5xl text-green-500 mb-4"></i>
                        <h2 class="text-2xl font-bold mb-2">늘봄학교 만족도 조사</h2>
                        <p class="text-gray-500 mb-8 text-sm">참여하시는 분의 구분을 선택해주세요.<br>본 조사는 무기명으로 진행됩니다.</p>
                        
                        <div class="flex flex-col gap-4 w-full">
                            <button onclick="navigate('role_menu', {role: 'parent'})" class="flex items-center justify-center p-4 bg-blue-50 hover:bg-blue-100 text-blue-700 rounded-xl border border-blue-200 transition font-bold text-lg">
                                <i class="fa-solid fa-user-group mr-3 text-xl"></i> 학부모님
                            </button>
                            <button onclick="navigate('role_menu', {role: 'student'})" class="flex items-center justify-center p-4 bg-yellow-50 hover:bg-yellow-100 text-yellow-700 rounded-xl border border-yellow-200 transition font-bold text-lg">
                                <i class="fa-solid fa-child-reaching mr-3 text-xl"></i> 학생
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        // --- STREAMING_CHUNK:Rendering Sub Menu... ---
        function renderRoleMenu(container) {
            const roleName = currentRole === 'parent' ? '학부모' : '학생';
            const icon = currentRole === 'parent' ? '<i class="fa-solid fa-user-group text-blue-500"></i>' : '<i class="fa-solid fa-child-reaching text-yellow-500"></i>';
            
            container.innerHTML = `
                <div class="w-full flex flex-col flex-grow fade-in max-w-2xl mt-8">
                    <button onclick="navigate('home')" class="self-start mb-4 text-gray-500 hover:text-gray-800 transition">
                        <i class="fa-solid fa-arrow-left mr-1"></i> 처음으로
                    </button>
                    
                    <div class="bg-white p-6 rounded-2xl shadow-md border-l-4 border-green-500 mb-6">
                        <h2 class="text-xl font-bold flex items-center gap-2">
                            ${icon} ${roleName} 만족도 조사 메뉴
                        </h2>
                        <p class="text-gray-600 mt-2 text-sm">참여하실 설문조사를 선택해주세요.</p>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div onclick="navigate('survey_form', {type: currentRole === 'parent' ? 'parentGeneral' : 'studentGeneral'})" class="bg-white p-6 rounded-xl shadow hover:shadow-md cursor-pointer transition border border-gray-100 group">
                            <div class="bg-green-100 w-12 h-12 rounded-full flex items-center justify-center mb-4 group-hover:scale-110 transition-transform">
                                <i class="fa-regular fa-clipboard text-green-600 text-xl"></i>
                            </div>
                            <h3 class="font-bold text-lg mb-2">운영 전반 만족도 조사</h3>
                            <p class="text-gray-500 text-sm">늘봄학교 운영 전반에 대한 만족도를 조사합니다.</p>
                        </div>
                        
                        <div onclick="navigate('survey_form', {type: 'programSpecific'})" class="bg-white p-6 rounded-xl shadow hover:shadow-md cursor-pointer transition border border-gray-100 group">
                            <div class="bg-purple-100 w-12 h-12 rounded-full flex items-center justify-center mb-4 group-hover:scale-110 transition-transform">
                                <i class="fa-solid fa-shapes text-purple-600 text-xl"></i>
                            </div>
                            <h3 class="font-bold text-lg mb-2">프로그램별 만족도 조사</h3>
                            <p class="text-gray-500 text-sm">참여중인 개별 프로그램에 대한 만족도를 조사합니다.</p>
                        </div>
                    </div>
                </div>
            `;
        }

        // --- STREAMING_CHUNK:Defining Survey Questions... ---
        const questionBanks = {
            parentGeneral: {
                title: "2026학년도 2학기 늘봄학교 운영전반 만족도 조사 (학부모용)",
                questions: [
                    { id: "q1", text: "1. 늘봄학교 운영 전반에 대해 만족한다.", type: "scale", labels: labelsType1 },
                    { id: "q2", text: "2. 현재 참여하고 있는 늘봄학교 프로그램이 자녀의 특기·적성 계발 또는 학업 실력 향상에 도움이 되었다.", type: "scale", labels: labelsType1 },
                    { id: "q3", text: "3. 늘봄학교 프로그램이 사교육비를 줄이는 데 도움이 되었다.", type: "scale", labels: labelsType1 },
                    { id: "q4", text: "4. 앞으로 늘봄학교 프로그램에 자녀를 계속 참여시킬 의사가 있다.", type: "scale", labels: labelsType1 },
                    { id: "q5", text: "5. 기타 (개선 사항 및 추가 개설 희망 프로그램 등)", type: "text" }
                ]
            },
            studentGeneral: {
                title: "2026학년도 2학기 늘봄학교 운영전반 만족도 조사 (학생용)",
                questions: [
                    { id: "q1", text: "1. 현재 참여하고 있는 늘봄학교 프로그램에 대해 만족한다.", type: "scale", labels: labelsType1 },
                    { id: "q2", text: "2. 늘봄학교 프로그램을 선택할 때, 프로그램에 대한 정보 제공(안내)은 충분했다.", type: "scale", labels: labelsType2 },
                    { id: "q3", text: "3. 현재 참여하고 있는 늘봄학교 프로그램이 특기·적성 계발 또는 학업 실력 향상에 도움이 되었다.", type: "scale", labels: labelsType1 },
                    { id: "q4", text: "4. 앞으로 늘봄학교 프로그램에 계속 참여하고 싶다.", type: "scale", labels: labelsType1 },
                    { id: "q5", text: "5. 기타 (개선 사항 및 추가 개설 희망 프로그램 등)", type: "text" }
                ]
            },
            programSpecific: {
                title: "프로그램별 만족도 조사",
                requiresProgramName: true,
                questions: [
                    { id: "q1", text: "1. 강사가 프로그램 운영 시간을 잘 지켰다.", type: "scale", labels: labelsType1 },
                    { id: "q2", text: "2. 사용된 교재 및 교구는 프로그램 활동에 도움이 되었다.", type: "scale", labels: labelsType1 },
                    { id: "q3", text: "3. 학생이 프로그램에 적극 참여할 수 있도록 관심을 가지고 지도했다.", type: "scale", labels: labelsType2 },
                    { id: "q4", text: "4. 이 프로그램이 특기·적성 계발 또는 학업 실력 향상에 도움이 되었다.", type: "scale", labels: labelsType1 }
                ]
            }
        };

        // --- STREAMING_CHUNK:Rendering Survey Form... ---
        function renderSurveyForm(container, type) {
            const surveyData = questionBanks[type];
            let formHTML = `
                <div class="w-full fade-in max-w-3xl mt-4 mb-10">
                    <button onclick="navigate('role_menu', {role: currentRole})" class="mb-4 text-gray-500 hover:text-gray-800 transition block">
                        <i class="fa-solid fa-arrow-left mr-1"></i> 뒤로가기
                    </button>
                    
                    <div class="bg-white rounded-xl shadow-md overflow-hidden">
                        <div class="bg-green-600 text-white p-6">
                            <h2 class="text-xl md:text-2xl font-bold">${surveyData.title}</h2>
                            <p class="mt-2 text-green-100 text-sm">본 설문은 무기명으로 진행되며, 응답하신 내용은 통계 및 개선 목적으로만 활용됩니다.</p>
                        </div>
                        
                        <form id="survey-form" class="p-6 md:p-8" onsubmit="submitSurvey(event, '${type}')">
            `;

            if (surveyData.requiresProgramName) {
                formHTML += `
                            <div class="mb-8 p-4 bg-gray-50 rounded-lg border border-gray-200">
                                <label for="programName" class="block font-bold mb-2 text-gray-800">
                                    <span class="text-red-500 mr-1">*</span>참여 프로그램명
                                </label>
                                <input type="text" id="programName" required placeholder="예: 창의미술, AI코딩" 
                                    class="w-full p-3 border border-gray-300 rounded focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none transition">
                            </div>
                `;
            }

            surveyData.questions.forEach((q, idx) => {
                formHTML += `
                    <div class="mb-8 pb-8 ${idx !== surveyData.questions.length - 1 ? 'border-b border-gray-100' : ''}">
                        <h4 class="font-bold text-gray-800 mb-4 whitespace-pre-wrap leading-relaxed">${q.text}</h4>
                `;

                if (q.type === 'scale') {
                    formHTML += `<div class="grid grid-cols-1 sm:grid-cols-5 gap-2">`;
                    // Assign values 5 to 1 (5 is highly positive, 1 is highly negative based on usual scales, but mapping 1 to label[0] based on prompt)
                    // Prompt: ① 매우그렇다 ② 그렇다 ③ 보통이다 ④ 그렇지 않다 ⑤ 매우 그렇지 않다
                    // We will store string labels for simplicity.
                    q.labels.forEach((label, i) => {
                        const valNumber = i + 1; // 1 to 5
                        const uniqueId = `${q.id}_${valNumber}`;
                        formHTML += `
                            <div class="relative">
                                <input type="radio" name="${q.id}" id="${uniqueId}" value="${label}" required class="peer sr-only scale-radio">
                                <label for="${uniqueId}" class="flex flex-col items-center justify-center p-3 border border-gray-300 rounded-lg cursor-pointer hover:bg-gray-50 transition text-sm text-center h-full">
                                    <span class="font-bold text-gray-400 mb-1">①②③④⑤</span>
                                    <span class="font-medium text-gray-700">${label}</span>
                                </label>
                            </div>
                        `;
                        // Replace the fake numbering icon with actual numbers
                        formHTML = formHTML.replace('①②③④⑤', `<span class='inline-block w-6 h-6 rounded-full bg-gray-200 text-gray-600 flex items-center justify-center text-xs mb-1'>${valNumber}</span>`);
                    });
                    formHTML += `</div>`;
                } else if (q.type === 'text') {
                    formHTML += `
                        <textarea name="${q.id}" rows="3" placeholder="자유롭게 의견을 적어주세요." class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none transition resize-none"></textarea>
                    `;
                }
                formHTML += `</div>`;
            });

            formHTML += `
                            <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-4 rounded-lg shadow-lg transition text-lg mt-4">
                                설문 제출하기
                            </button>
                        </form>
                    </div>
                </div>
            `;
            container.innerHTML = formHTML;
        }

        // --- STREAMING_CHUNK:Survey Submission Handling... ---
        function submitSurvey(event, type) {
            event.preventDefault();
            const form = event.target;
            const formData = new FormData(form);
            let response = {
                timestamp: new Date().toISOString(),
                role: currentRole
            };

            const surveyData = questionBanks[type];
            
            if (surveyData.requiresProgramName) {
                response.programName = document.getElementById('programName').value.trim();
            }

            surveyData.questions.forEach(q => {
                response[q.id] = formData.get(q.id) || ""; // Get value or empty string for text
            });

            // Save to memory
            surveys[type].push(response);

            // Show success and redirect
            showModal("제출 완료", "설문이 성공적으로 제출되었습니다. 참여해 주셔서 감사합니다!", () => {
                navigate('home');
            });
        }

        // --- STREAMING_CHUNK:Admin Login Screen... ---
        function renderAdminLogin(container) {
            container.innerHTML = `
                <div class="w-full flex flex-col items-center justify-center flex-grow fade-in mt-10">
                    <div class="bg-white p-8 rounded-2xl shadow-lg text-center max-w-sm w-full">
                        <i class="fa-solid fa-lock text-4xl text-gray-700 mb-4"></i>
                        <h2 class="text-2xl font-bold mb-6 text-gray-800">관리자 모드</h2>
                        
                        <form id="admin-login-form" onsubmit="handleAdminLogin(event)">
                            <div class="mb-6 text-left">
                                <label class="block text-sm font-bold text-gray-700 mb-2">비밀번호</label>
                                <input type="password" id="admin-pw" class="w-full p-3 border border-gray-300 rounded focus:ring-2 focus:ring-green-500 outline-none" required placeholder="비밀번호 입력">
                            </div>
                            <div class="flex gap-2">
                                <button type="button" onclick="navigate('home')" class="w-1/3 bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-3 rounded transition">
                                    취소
                                </button>
                                <button type="submit" class="w-2/3 bg-gray-800 hover:bg-gray-900 text-white font-bold py-3 rounded transition">
                                    접속
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            `;
        }

        function handleAdminLogin(event) {
            event.preventDefault();
            const pw = document.getElementById('admin-pw').value;
            if (pw === '1208') {
                navigate('admin_dashboard');
            } else {
                showModal("로그인 실패", "비밀번호가 올바르지 않습니다.");
            }
        }

        // --- STREAMING_CHUNK:Admin Dashboard Generation... ---
        function renderAdminDashboard(container) {
            const totalParent = surveys.parentGeneral.length;
            const totalStudent = surveys.studentGeneral.length;
            const totalProgram = surveys.programSpecific.length;

            let html = `
                <div class="w-full fade-in max-w-5xl mt-4 mb-10">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-2xl font-bold text-gray-800"><i class="fa-solid fa-chart-pie mr-2 text-green-600"></i>설문조사 통계 대시보드</h2>
                        <button onclick="navigate('home')" class="bg-gray-200 hover:bg-gray-300 text-gray-700 px-4 py-2 rounded font-medium transition">
                            나가기
                        </button>
                    </div>

                    <!-- Summary Cards -->
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
                        <div class="bg-white p-6 rounded-xl shadow border-t-4 border-blue-500">
                            <p class="text-gray-500 text-sm font-bold">학부모 운영전반 만족도</p>
                            <h3 class="text-3xl font-bold mt-2">${totalParent}<span class="text-lg text-gray-400 font-normal ml-1">명 참여</span></h3>
                        </div>
                        <div class="bg-white p-6 rounded-xl shadow border-t-4 border-yellow-500">
                            <p class="text-gray-500 text-sm font-bold">학생 운영전반 만족도</p>
                            <h3 class="text-3xl font-bold mt-2">${totalStudent}<span class="text-lg text-gray-400 font-normal ml-1">명 참여</span></h3>
                        </div>
                        <div class="bg-white p-6 rounded-xl shadow border-t-4 border-purple-500">
                            <p class="text-gray-500 text-sm font-bold">프로그램별 만족도</p>
                            <h3 class="text-3xl font-bold mt-2">${totalProgram}<span class="text-lg text-gray-400 font-normal ml-1">건 참여</span></h3>
                        </div>
                    </div>
            `;

            // Function to generate section HTML
            const generateSection = (surveyKey, title) => {
                const data = surveys[surveyKey];
                const bank = questionBanks[surveyKey];
                
                let sectionHtml = `
                    <div class="bg-white rounded-xl shadow mb-8 overflow-hidden">
                        <div class="bg-gray-50 px-6 py-4 border-b border-gray-200">
                            <h3 class="text-lg font-bold text-gray-800">${title} 상세 통계</h3>
                        </div>
                        <div class="p-6">
                `;

                if (data.length === 0) {
                    sectionHtml += `<p class="text-gray-500 text-center py-4">아직 수집된 응답이 없습니다.</p></div></div>`;
                    return sectionHtml;
                }

                bank.questions.forEach(q => {
                    sectionHtml += `<div class="mb-6"><h4 class="font-bold text-gray-700 text-sm mb-3">${q.text}</h4>`;
                    
                    if (q.type === 'scale') {
                        // Count frequencies
                        let counts = {};
                        q.labels.forEach(l => counts[l] = 0);
                        data.forEach(response => {
                            const val = response[q.id];
                            if (counts[val] !== undefined) counts[val]++;
                        });

                        sectionHtml += `<div class="space-y-2">`;
                        q.labels.forEach((label, i) => {
                            const count = counts[label];
                            const percentage = Math.round((count / data.length) * 100) || 0;
                            const barColor = ['bg-green-500', 'bg-blue-500', 'bg-yellow-500', 'bg-orange-500', 'bg-red-500'][i];

                            sectionHtml += `
                                <div class="flex items-center text-sm">
                                    <div class="w-32 truncate mr-2" title="${label}">${i+1}. ${label.substring(0,6)}${label.length>6?'..':''}</div>
                                    <div class="flex-grow bg-gray-100 rounded-full h-4 mr-4 overflow-hidden relative">
                                        <div class="${barColor} h-4 rounded-full" style="width: ${percentage}%"></div>
                                    </div>
                                    <div class="w-16 text-right font-medium text-gray-600">${count}명 <span class="text-xs text-gray-400">(${percentage}%)</span></div>
                                </div>
                            `;
                        });
                        sectionHtml += `</div>`;
                    } else if (q.type === 'text') {
                        sectionHtml += `<div class="bg-gray-50 p-4 rounded text-sm max-h-40 overflow-y-auto space-y-2">`;
                        const textResponses = data.map(r => r[q.id]).filter(t => t.trim() !== '');
                        if (textResponses.length === 0) {
                            sectionHtml += `<p class="text-gray-400 italic">의견이 없습니다.</p>`;
                        } else {
                            textResponses.forEach(t => {
                                sectionHtml += `<div class="bg-white p-2 border border-gray-200 rounded text-gray-700 shadow-sm">- ${t}</div>`;
                            });
                        }
                        sectionHtml += `</div>`;
                    }
                    sectionHtml += `</div>`;
                });

                sectionHtml += `</div></div>`;
                return sectionHtml;
            };

            html += generateSection('parentGeneral', '학부모 운영전반 만족도');
            html += generateSection('studentGeneral', '학생 운영전반 만족도');
            
            // For program specific, group by program name
            if (totalProgram > 0) {
                 html += `
                    <div class="bg-white rounded-xl shadow mb-8 overflow-hidden">
                        <div class="bg-gray-50 px-6 py-4 border-b border-gray-200">
                            <h3 class="text-lg font-bold text-gray-800">프로그램별 만족도 통합 통계 (전체)</h3>
                        </div>
                        <div class="p-6 text-sm text-gray-500 mb-4">
                            참여된 프로그램 목록: 
                            <span class="font-bold text-gray-700">
                            ${[...new Set(surveys.programSpecific.map(s => s.programName))].join(', ')}
                            </span>
                        </div>
                `;
                html += generateSection('programSpecific', '프로그램별 문항 전체'); // Uses the same generator but we strip outer shell to avoid nesting weirdness. For simplicity, just rendering it directly below.
            } else {
                html += generateSection('programSpecific', '프로그램별 만족도');
            }


            html += `</div>`;
            container.innerHTML = html;
        }

        // --- STREAMING_CHUNK:Initialization... ---
        window.onload = () => {
            navigate('home');
        };
    </script>
</body>
